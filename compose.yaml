services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # CA of the optional Samba AD container (profile "ad"); empty otherwise.
            - 'samba-ad-tls:/etc/ssl/samba-ad:ro'
        networks:
            - sail
        depends_on:
            - pgsql
            - mailpit
            - redis
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    # Optional Active Directory for development: COMPOSE_PROFILES=ad ./vendor/bin/sail up -d
    # Test domain CORP.EXAMPLE with demo passwords; see docs/development/active-directory.md.
    samba-ad:
        build:
            context: ./docker/samba-ad
        image: 'ictmt/samba-ad-dev'
        profiles:
            - ad
        hostname: dc1
        domainname: corp.example
        volumes:
            - 'samba-ad-data:/var/lib/samba'
            - 'samba-ad-tls:/export/tls'
        networks:
            sail:
                aliases:
                    - dc1.corp.example
    # Optional mail server for development (SMTP 3025, IMAP 3143): COMPOSE_PROFILES=mail ./vendor/bin/sail up -d
    # Test mailbox helpdesk@corp.example; see docs/development/email-to-ticket.md.
    greenmail:
        image: 'greenmail/standalone:2.1.14'
        profiles:
            - mail
        environment:
            GREENMAIL_OPTS: '-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=helpdesk:helpdesk-dev-only@corp.example -Dgreenmail.users.login=email -Dgreenmail.verbose'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    samba-ad-data:
        driver: local
    samba-ad-tls:
        driver: local
