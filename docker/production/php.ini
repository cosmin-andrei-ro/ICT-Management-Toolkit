expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.validate_timestamps = 0
session.cookie_httponly = 1
