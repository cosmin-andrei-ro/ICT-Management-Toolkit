# Production stack (ADR 0070). See "Install with Docker" in docs/installation.md.
name: ict-toolkit-production

x-application: &application
    image: ict-management-toolkit/app:latest
    env_file: .env
    environment: &application-environment
        APP_ENV: production
        APP_DEBUG: 'false'
        LOG_CHANNEL: stderr
        LOG_LEVEL: warning
        DB_CONNECTION: pgsql
        DB_HOST: pgsql
        DB_PORT: 5432
        DB_DATABASE: toolkit
        DB_USERNAME: toolkit
        SESSION_DRIVER: redis
        SESSION_SECURE_COOKIE: 'true'
        CACHE_STORE: redis
        QUEUE_CONNECTION: redis
        REDIS_CLIENT: phpredis
        REDIS_HOST: redis
        MAIL_MAILER: smtp
    volumes:
        - storage:/var/www/html/storage/app
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

services:
    web:
        build:
            context: ../..
            dockerfile: docker/production/Dockerfile
            target: web
        image: ict-management-toolkit/web:latest
        environment:
            DOMAIN: ${DOMAIN:?Set DOMAIN in docker/production/.env}
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        networks: [outside, inside]
        depends_on:
            app:
                condition: service_healthy
        cap_drop: [ALL]
        cap_add: [NET_BIND_SERVICE]
        security_opt: ['no-new-privileges:true']
        restart: unless-stopped

    app:
        <<: *application
        build:
            context: ../..
            dockerfile: docker/production/Dockerfile
            target: app
        networks: [outside, inside]
        depends_on:
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
            interval: 10s
            timeout: 3s
            retries: 12

    worker:
        <<: *application
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--max-time=3600']
        networks: [outside, inside]
        depends_on:
            migrate:
                condition: service_completed_successfully

    scheduler:
        <<: *application
        command: ['php', 'artisan', 'schedule:work']
        networks: [outside, inside]
        depends_on:
            migrate:
                condition: service_completed_successfully

    # Runs at every start, then stops: brings the database and the permissions up to date
    migrate:
        <<: *application
        command: ['sh', '-c', 'php artisan migrate --force && php artisan core:permissions:sync']
        networks: [inside]
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: 'no'

    pgsql:
        image: 'postgres:18-alpine'
        environment:
            POSTGRES_DB: toolkit
            POSTGRES_USER: toolkit
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/production/.env}
        volumes:
            - pgsql:/var/lib/postgresql
        networks: [inside]
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', 'toolkit', '-U', 'toolkit']
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

    redis:
        image: 'redis:8.10.3-alpine'
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/production/.env}', '--appendonly', 'yes']
        volumes:
            - redis:/data
        networks: [inside]
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            interval: 5s
            timeout: 3s
            retries: 12
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        restart: unless-stopped

    # Optional, for PDF documents: start with --profile pdf and set GOTENBERG_URL=http://gotenberg:3000.
    # Chromium runs without JavaScript and may fetch nothing: documents carry their styles
    gotenberg:
        image: 'gotenberg/gotenberg:8.39.0'
        profiles: [pdf]
        command:
            - gotenberg
            - '--chromium-disable-javascript'
            - '--chromium-deny-list=^file:(?!//\/tmp/).*'
            - '--chromium-deny-list=^(https?|ftp|wss?):.*'
            - '--chromium-deny-private-ips'
            - '--libreoffice-disable-routes'
            - '--api-disable-download-from'
            - '--webhook-disable'
        networks: [inside]
        restart: unless-stopped

networks:
    outside:
    # No way out to the internet, and no published ports: only the containers reach these services
    inside:
        internal: true

volumes:
    storage:
    pgsql:
    redis:
    caddy-data:
    caddy-config:
