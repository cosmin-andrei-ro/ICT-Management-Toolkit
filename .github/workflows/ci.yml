name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, static analysis and tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version we promise (composer.json), and the one we develop on
        php: ['8.4', '8.5']

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, intl, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Before composer install: its post-autoload-dump scripts boot the application.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Dependency audit
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

      - name: Pest
        run: composer test

  production-images:
    name: Production images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the Compose file
        run: |
          cp docker/production/.env.example docker/production/.env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/' docker/production/.env
          docker compose -f docker/production/compose.yaml config --quiet

      - name: Build
        run: docker compose -f docker/production/compose.yaml build
